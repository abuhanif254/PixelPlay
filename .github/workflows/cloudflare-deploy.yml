name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # Change this if your default branch has a different name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install Dependencies
        run: pnpm install

      - name: Build Next.js App
        # GitHub Actions runners have 7GB RAM, so we can give Node plenty of memory!
        run: pnpm dlx @cloudflare/next-on-pages@1
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'pixelplay' # Replace with your exact Cloudflare Pages project name if different
          directory: '.vercel/output/static'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
